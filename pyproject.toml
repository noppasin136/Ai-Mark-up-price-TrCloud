[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markup-pricing"
version = "0.3.1"
description = "Config-driven retail price markup engine over ERP GR2 / W10 extracts"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "PyYAML>=6.0", "click>=8.1"]

[project.scripts]
markup = "markup.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
