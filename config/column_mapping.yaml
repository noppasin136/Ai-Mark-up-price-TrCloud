# =============================================================================
# ERP COLUMN MAPPING
# Left  = canonical name the engine uses internally (do NOT rename these)
# Right = list of possible header spellings in your ERP export (case-insensitive,
#         whitespace/underscore tolerant). Add your real headers to each list.
# =============================================================================

gr2:                    # Goods Receipt report — the cost source
  sheet: 0              # sheet name or 0-based index
  header_row: 0         # 0-based row index holding the headers
  columns:
    sku:            [SKU, Item Code, Item No, Product Code, Material]
    product_name:   [Product Name, Item Name, Description, Material Description]
    receipt_date:   [GR Date, Receipt Date, Posting Date, Doc Date, Document Date]
    receipt_no:     [GR No, GR Document, Receipt No, Doc No]
    qty:            [Qty, Quantity, GR Qty, Received Qty]
    uom:            [UOM, Unit, Base Unit, Unit of Measure]
    unit_cost:      [Unit Cost, Unit Price, Purchase Price, Net Price]
    total_cost:     [Total Cost, Amount, Net Amount, Line Amount]
    freight:        [Freight, Freight Cost, Transport]
    duty:           [Duty, Import Duty, Tax Cost]
    other_landed:   [Other Cost, Landed Other, Misc Cost]
    currency:       [Currency, Curr, CCY]
    supplier:       [Supplier, Vendor, Vendor Name]

w10:                    # Current selling price report
  sheet: 0
  header_row: 0
  columns:
    sku:                [SKU, Item Code, Item No, Product Code]
    product_name:       [Product Name, Item Name, Description]
    uom:                [UOM, Sales Unit, Selling Unit, Base Unit]
    current_price:      [Price, Sale Price, Selling Price, Unit Price, Retail Price]
    parallel_uom:       [Parallel Unit, Parallel UOM, Alt Unit, Secondary Unit, Pack Unit]
    parallel_price:     [Parallel Price, Alt Price, Pack Price]
    conversion_factor:  [Conversion, Conv Factor, Pack Size, Units Per Pack, Ratio]
    category:           [Category, Product Group, Item Group, Merch Group]
    subcategory:        [Subcategory, Sub Group, Class]
    department:         [Department, Division, Dept]
    brand:              [Brand, Brand Name]
    status:             [Status, Item Status, Active]

markup_list:            # Your markup master
  sheet: 0
  header_row: 0
  columns:
    level:          [Level, Rule Level, Type]        # sku|subcategory|category|department
    key:            [Key, Code, Value, Group Code]   # the matching value for that level
    markup_pct:     [Markup, Markup %, Markup Pct, Percent, Margin %]
    basis:          [Basis, Method]                  # optional per-row: cost_plus|margin
    min_margin_pct: [Min Margin, Floor Margin]       # optional per-row override
    note:           [Note, Remark, Comment]

sale_list:              # Which SKUs to price and in which selling unit
  sheet: 0
  header_row: 0
  columns:
    sku:            [SKU, Item Code, Item No, Product Code]
    sale_uom:       [Unit, Sale Unit, Selling Unit, UOM]
    product_name:   [Product Name, Item Name, Description]
    include:        [Include, Active, Price Flag]
