# =============================================================================
# ERP COLUMN MAPPING  —  configured for the Spicy Cat Thai ERP exports
# Left  = canonical name the engine uses internally (do NOT rename these)
# Right = header spellings to look for (case-insensitive, space/underscore
#         tolerant). Both the Thai headers and English fallbacks are listed, so
#         the same config works if the report language is ever switched.
# =============================================================================

gr2:                          # Goods receipt report — the cost source
  sheet: data
  header_row: 0
  columns:
    sku:            [รหัสสินค้า, SKU, Item Code, Product Code]
    product_name:   [ชื่อสินค้า, Product Name, Item Name, Description]
    category:       [กลุ่มสินค้า, Category, Product Group, Item Group]
    receipt_date:   [วันที่, GR Date, Receipt Date, Posting Date, Doc Date]
    receipt_no:     [เลขที่เอกสาร, GR No, Doc No, Document No]
    doc_type:       [ประเภทเอกสาร, Doc Type, Document Type]
    qty:            [จำนวน, Qty, Quantity, Received Qty]
    uom:            [หน่วย, UOM, Unit, Unit of Measure]
    unit_cost:      [ต้นทุนต่อหน่วย, Unit Cost, Unit Price, Purchase Price]
    total_cost:     [ต้นทุนรวม, Total Cost, Amount, Line Amount]
    freight:        [ค่าขนส่ง, Freight, Freight Cost]
    duty:           [ภาษีนำเข้า, Duty, Import Duty]
    other_landed:   [ค่าใช้จ่ายอื่น, Other Cost, Landed Other]
    currency:       [Currency, สกุลเงิน, Curr]
    supplier:       [ชื่อ, Supplier, Vendor, Vendor Name]

w10:                          # Unit master — one row per SKU *and unit*
  sheet: data
  header_row: 0
  columns:
    sku:                [รหัสสินค้า, SKU, Item Code, Product Code]
    product_name:       [ชื่อสินค้า, Product Name, Item Name]
    uom:                [หน่วย, UOM, Unit, Sales Unit, Selling Unit]
    conversion_factor:  [Ccoefficient, Coefficient, Conversion, Conv Factor, Pack Size]
    is_base_unit:       [เป็นหน่วยหลัก, Is Main, Is Base Unit, Base Unit Flag]
    current_price:      [ราคาขาย, Sale Price, Selling Price, Price]
    buy_price:          [ราคาซื้อ, Buy Price, Purchase Price]
    category:           [กลุ่มสินค้า, Category, Product Group, Item Group]
    subcategory:        [กลุ่มย่อย, Subcategory, Sub Group]
    department:         [แผนก, Department, Division]

markup_list:                  # Markup master — one row per SKU
  sheet: SellingPrice
  header_row: 0
  columns:
    # Optional. Absent -> every row is treated as a SKU-level rule, which is
    # what a list with one row per product code means.
    level:          [Level, Rule Level, Type]
    key:            [Code, รหัสสินค้า, SKU, Item Code, Key]
    product_name:   [Product Name, ชื่อสินค้า, Item Name]
    sale_uom:       [Sale Unit, หน่วยขาย, Selling Unit, Unit]
    current_price:  [Selling Price, ราคาขาย, Sale Price]
    category:       [Category, กลุ่มสินค้า, Product Group]
    markup_pct:     [Markup, Markup %, มาร์กอัพ, Percent]
    basis:          [Basis, Method]
    min_margin_pct: [Min Margin, Floor Margin]
    note:           [Note, Remark, Comment, หมายเหตุ]

sale_list:                    # Scope — which SKUs to price and in which unit
  sheet: SellingPrice
  header_row: 0
  columns:
    sku:            [Code, รหัสสินค้า, SKU, Item Code]
    sale_uom:       [Sale Unit, หน่วยขาย, Selling Unit, Unit]
    current_price:  [Selling Price, ราคาขาย, Sale Price]
    product_name:   [Product Name, ชื่อสินค้า, Item Name]
    include:        [Include, Active, Price Flag]

my_cargo:                     # Import landed cost — one row per imported SKU
  # The tab is renamed every upload (Seb26, then the next period's name), so the
  # loader always reads the FIRST sheet regardless of the name here.
  sheet: 0
  header_row: 0
  columns:
    sku:                [code, Code, รหัสสินค้า, SKU, Item Code]
    product_name:       [name, Product Name, ชื่อสินค้า]
    unit:               [unit, Unit, หน่วย]
    # Goods cost per base unit, before any freight.
    product_cost:       [ราคา-หน่วยหลัก, ราคาหน่วยหลัก, Product Cost, Unit Cost]
    # Overseas freight + import duty per base unit.
    oversea_transport:  [Oversea Transport+Import duty (Optional), Oversea Transport, Freight]
    # Present but always empty today — summed in if they are ever filled.
    vat:                [VAT(CARGO), VAT]
    inland_transport:   [Inland Transport (เฉลี่ย), Inland Transport]
    # Only set on rows that carry no cost — a manual price to hold at.
    manual_price:       [Sale Price, ราคาขาย]
